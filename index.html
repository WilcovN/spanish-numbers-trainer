<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section id="home">
        <h1>Spanish Numbers Trainer</h1>
        <p>
            Practice writing Spanish numbers as words. Choose your settings,
            pick a mode, and pres Start.
        </p>

        <label for="range">Number range</label>
        <select id="range">
            <option value="100">0 - 100</option>
            <option value="1000">0 - 1,000</option>
            <option value="100000">0 - 100,000</option>
            <option value="1000000">0 - 1,000,000</option>
        </select>
        
        <label for="question-count">Questions</label>
        <input type="number" id="question-count" min="5" max="50" value="20">

        <p>Mode</p>
        <label><input type="radio" name="mode" value="test" checked> Test — ...</label>
        <label><input type="radio" name="mode" value="mastery"> Mastery — ...</label>

        <button id="start-btn">Start</button>
    </section>
    
    <section id="practice" hidden>
        <h2>52.481</h2>
        <input type="text">
        <button>Controleer</button>
    </section>

    <section id="feedback" hidden>
        <h2>14 van 20 goed!</h2>
        <button>Opnieuw</button>
    </section>
</body>
</html>
